         og:image paths inconsistently. -->

    <meta property="og:url" content="https://roshan5619.github.io/HH_Goa2k26_ID_Builder/" />
    <meta property="og:title" content="Builder ID · Hacker House Goa 2026" />
    <meta
      property="og:description"
      content="Upload a photo, get your Hacker House Goa 2026 builder ID, share it with #FrameInGoa."
    />
    <meta
      property="og:image"
      content="https://roshan5619.github.io/HH_Goa2k26_ID_Builder/og-default.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Builder ID · Hacker House Goa 2026" />

      name="twitter:description"
      content="Upload a photo, get your Hacker House Goa 2026 builder ID, share it with #FrameInGoa."
    />

      name="twitter:image"
      content="https://roshan5619.github.io/HH_Goa2k26_ID_Builder/og-default.png"
