name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows redeploying the current main without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy can leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deploying an unverified build would defeat the point of CI, so the
      # checks run here too rather than relying on the CI workflow's timing.
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Baked into the footer so a live build is traceable to a commit.
          GITHUB_SHA: ${{ github.sha }}
          # Set this repository variable once the share service is deployed to
          # enable link previews; the app works without it.
          VITE_SHARE_ORIGIN: ${{ vars.VITE_SHARE_ORIGIN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
